name: Crash Report
description: "Report a crash involving Create: Sulfuric Resonance."
title: "[Crash] "
labels:
  - crash
  - needs-triage
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Use this form if Minecraft crashed while Create: Sulfuric Resonance was installed.

        A crash report or latest.log is extremely important for diagnosing crashes.

  - type: checkboxes
    id: existing
    attributes:
      label: Existing Issue Check
      description: "Please check existing issues before submitting a new crash report."
      options:
        - label: "I have searched the existing issues and did not find this crash already reported."
          required: true

  - type: dropdown
    id: csr-version
    attributes:
      label: "Create: Sulfuric Resonance Version"
      description: "Which version of CSR are you using?"
      options:
        - "0.2.9-beta"
        - "0.2.8-beta / Hotfix"
        - "0.2.7-beta"
        - "Older version"
        - "Development build"
    validations:
      required: true

  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft Version
      placeholder: "Example: 1.21.1"
    validations:
      required: true

  - type: input
    id: neoforge-version
    attributes:
      label: NeoForge Version
      placeholder: "Example: 21.1.247"
    validations:
      required: true

  - type: input
    id: create-version
    attributes:
      label: Create Version
      placeholder: "Example: 6.0.7"
    validations:
      required: true

  - type: dropdown
    id: crash-time
    attributes:
      label: When did the crash happen?
      options:
        - "During game startup"
        - "When loading or creating a world"
        - "While joining a server"
        - "While placing a CSR block"
        - "While interacting with a CSR block"
        - "During recipe processing"
        - "During resource reload"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What were you doing when the game crashed?
      description: "Describe exactly what you were doing immediately before the crash."
      placeholder: |
        Example:
        I placed a Sulfuric Resonance Chamber, connected rotation, and the game crashed when I right-clicked it.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: "Provide exact steps if the crash can be reproduced."
      placeholder: |
        1. Place...
        2. Connect...
        3. Interact with...
        4. Game crashes.
    validations:
      required: true

  - type: textarea
    id: crash-report
    attributes:
      label: Crash Report
      description: |
        Drag the crash report file into this box.

        Crash reports can usually be found inside the Minecraft crash-reports folder.
    validations:
      required: false

  - type: textarea
    id: latest-log
    attributes:
      label: latest.log
      description: |
        Drag your latest.log file into this box.

        It can usually be found inside the Minecraft logs folder.
    validations:
      required: true

  - type: textarea
    id: mods
    attributes:
      label: Mod List
      description: |
        Attach or paste your installed mod list.

        This is especially important if the crash happens inside a modpack.
      placeholder: |
        Create:
        JEI:
        EMI:
        Jade:
        Other mods:
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: |
        Add screenshots, videos, configuration changes, launcher information, or anything else that may help diagnose the crash.
    validations:
      required: false