import net.neoforged.moddevgradle.dsl.ModModel

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.142'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

/*
 * Resolve the main source set once without configuring it through a closure.
 * Generated data is added by processResources below, so no
 * additional source-set resource configuration is required.
 */
final NamedDomainObjectProvider<SourceSet> mainSourceSetProvider =
        sourceSets.named(SourceSet.MAIN_SOURCE_SET_NAME)

final def generatedResourcesDir = layout.projectDirectory.dir('src/generated/resources')
final def existingResourcesDir = layout.projectDirectory.dir('src/main/resources')
final def clientRunDir = layout.projectDirectory.dir('runs/client-0.0.2.5-beta-dev')
final def serverRunDir = layout.projectDirectory.dir('runs/server')
final def dataRunDir = layout.projectDirectory.dir('runs/data')

repositories {
    maven { MavenArtifactRepository repository ->
        repository.url = uri('https://maven.createmod.net')
    }

    maven { MavenArtifactRepository repository ->
        repository.url = uri('https://maven.ithundxr.dev/snapshots')
    }

    maven { MavenArtifactRepository repository ->
        repository.url = uri('https://maven.blamejared.com')
    }

    maven { MavenArtifactRepository repository ->
        repository.url = uri('https://repo.spongepowered.org/repository/maven-public/')
    }

    maven { MavenArtifactRepository repository ->
        repository.name = 'TerraformersMC'
        repository.url = uri('https://maven.terraformersmc.com/')
    }

    mavenCentral()
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
            gameDirectory = clientRunDir.asFile
        }

        server {
            server()
            gameDirectory = serverRunDir.asFile
        }

        data {
            data()
            gameDirectory = dataRunDir.asFile

            programArgument('--mod')
            programArgument(mod_id.toString())
            programArgument('--all')
            programArgument('--output')
            programArgument(generatedResourcesDir.asFile.absolutePath)
            programArgument('--existing')
            programArgument(existingResourcesDir.asFile.absolutePath)
        }
    }

    mods.register(mod_id.toString()) { ModModel modModel ->
        modModel.getModSourceSets().add(mainSourceSetProvider)
    }
}

final boolean loadJeiRuntime =
        providers.gradleProperty("load_jei")
                .orElse("true")
                .get()
                .toBoolean()

final boolean loadEmiRuntime =
        providers.gradleProperty("load_emi")
                .orElse("true")
                .get()
                .toBoolean()

dependencies {
    ExternalModuleDependency createSlimDependency =
            dependencies.create(
                    "com.simibubi.create:create-${minecraft_version}:${create_version}:slim"
            ) as ExternalModuleDependency

    createSlimDependency.transitive = false
    implementation(createSlimDependency)

    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")

    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")

    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    compileOnly(
            "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    )

    if (loadJeiRuntime) {
        runtimeOnly(
                "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
        )
    }

    compileOnly(
            "dev.emi:emi-neoforge:${emi_version}:api"
    )

    if (loadEmiRuntime) {
        runtimeOnly(
                "dev.emi:emi-neoforge:${emi_version}"
        )
    }

    annotationProcessor('org.spongepowered:mixin:0.8.7:processor')
}

final def generatedRefmapDirectory = layout.buildDirectory.dir('generated/mixin')
final String generatedRefmapName = 'sulfuricresonance.refmap.json'

tasks.withType(JavaCompile).configureEach { JavaCompile compileTask ->
    compileTask.options.encoding = 'UTF-8'

    compileTask.options.compilerArgs.add(
            '-AoutRefMapFile=' + generatedRefmapDirectory.get()
                    .file(generatedRefmapName)
                    .asFile
                    .absolutePath
    )
}

tasks.named('processResources', ProcessResources).configure { ProcessResources resourceTask ->
    /*
     * The refmap is produced by compileJava, so compile first and then copy it
     * into the processed resources output.
     */
    resourceTask.dependsOn(tasks.named('compileJava'))
    resourceTask.from(generatedRefmapDirectory)
}
