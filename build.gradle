plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.142'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    maven {
        url = 'https://maven.createmod.net'
    }

    maven {
        url = 'https://maven.ithundxr.dev/snapshots'
    }

    maven {
        url = 'https://maven.blamejared.com'
    }

    maven {
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }

    mavenCentral()
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
            gameDirectory = file('runs/client')
        }

        server {
            server()
            gameDirectory = file('runs/server')
        }
    }

    mods {
        "${mod_id}" {
            //noinspection GroovyAssignabilityCheck
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    def createSlimDependency =
            dependencies.create("com.simibubi.create:create-${minecraft_version}:${create_version}:slim")

    createSlimDependency.transitive = false
    implementation(createSlimDependency)

    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")

    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")

    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

    annotationProcessor("org.spongepowered:mixin:0.8.7:processor")
}

def generatedRefmapDirectory = layout.buildDirectory.dir('generated/mixin')
def generatedRefmapName = 'sulfuricresonance.refmap.json'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    options.compilerArgs.add(
            '-AoutRefMapFile='
                    + generatedRefmapDirectory.get()
                    .file(generatedRefmapName)
                    .asFile
                    .absolutePath
    )
}

tasks.named('processResources').configure {
    dependsOn tasks.named('compileJava')
    from generatedRefmapDirectory
}