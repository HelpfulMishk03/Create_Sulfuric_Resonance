import net.neoforged.moddevgradle.dsl.ModModel
import groovy.json.JsonOutput

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

final NamedDomainObjectProvider<SourceSet> mainSourceSetProvider =
        sourceSets.named(SourceSet.MAIN_SOURCE_SET_NAME)

final def generatedResourcesDir = layout.projectDirectory.dir('src/generated/resources')
final def existingResourcesDir = layout.projectDirectory.dir('src/main/resources')
final def clientRunDir = layout.projectDirectory.dir('runs/client-0.0.2.5-beta-dev')
final def serverRunDir = layout.projectDirectory.dir('runs/server')
final def dataRunDir = layout.projectDirectory.dir('runs/data')

repositories {
    maven { MavenArtifactRepository repository ->
        repository.url = uri('https://maven.createmod.net')
    }

    maven { MavenArtifactRepository repository ->
        repository.url = uri('https://maven.ithundxr.dev/snapshots')
    }

    maven { MavenArtifactRepository repository ->
        repository.url = uri('https://maven.blamejared.com')
    }

    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = uri('https://api.modrinth.com/maven')
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }

    maven { MavenArtifactRepository repository ->
        repository.url = uri('https://repo.spongepowered.org/repository/maven-public/')
    }

    maven { MavenArtifactRepository repository ->
        repository.name = 'TerraformersMC'
        repository.url = uri('https://maven.terraformersmc.com/')
    }

    mavenCentral()
}

configurations.configureEach { Configuration configuration ->
    configuration.resolutionStrategy.eachDependency { DependencyResolveDetails details ->
        if (details.requested.group == 'org.jline') {
            details.useVersion(jline_security_version.toString())
            details.because('Fix JLine history regular-expression denial of service and later 3.x security advisories')
        } else if (details.requested.group == 'org.apache.logging.log4j') {
            details.useVersion(log4j_security_version.toString())
        } else if (details.requested.group == 'org.apache.commons'
                && details.requested.name == 'commons-compress') {
            details.useVersion(commons_compress_security_version.toString())
        } else if (details.requested.group == 'org.apache.commons'
                && details.requested.name == 'commons-lang3') {
            details.useVersion(commons_lang_security_version.toString())
        } else if (details.requested.group == 'org.codehaus.plexus'
                && details.requested.name == 'plexus-utils') {
            details.useVersion(plexus_utils_security_version.toString())
        } else if (details.requested.group == 'at.yawk.lz4'
                && details.requested.name == 'lz4-java') {
            details.useVersion(lz4_java_security_version.toString())
        }
    }

    configuration.resolutionStrategy.dependencySubstitution {
        substitute(module('org.lz4:lz4-java'))
                .using(module("at.yawk.lz4:lz4-java:${lz4_java_security_version}"))
    }
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
            gameDirectory = clientRunDir.asFile
        }

        server {
            server()
            gameDirectory = serverRunDir.asFile
        }

        data {
            data()
            gameDirectory = dataRunDir.asFile

            programArgument('--mod')
            programArgument(mod_id.toString())
            programArgument('--all')
            programArgument('--output')
            programArgument(generatedResourcesDir.asFile.absolutePath)
            programArgument('--existing')
            programArgument(existingResourcesDir.asFile.absolutePath)
        }
    }

    mods.register(mod_id.toString()) { ModModel modModel ->
        modModel.getModSourceSets().add(mainSourceSetProvider)
    }
}

final boolean loadJeiRuntime =
        providers.gradleProperty("load_jei")
                .orElse("true")
                .get()
                .toBoolean()

final boolean loadEmiRuntime =
        providers.gradleProperty("load_emi")
                .orElse("true")
                .get()
                .toBoolean()

dependencies {
    // Aeronautics ships its Simulated, Aeronautics, and Offroad sections in
    // one bundled mod. These are actual NeoForge mods, so runtimeOnly places
    // them on ModDevGradle's scanned mod classpath (unlike its extra library
    // classpath, which is not the right place for mod discovery).
    runtimeOnly("maven.modrinth:oWaK0Q19:${aeronautics_version}")
    runtimeOnly("maven.modrinth:T9PomCSv:${sable_version}")

    ExternalModuleDependency createSlimDependency =
            dependencies.create(
                    "com.simibubi.create:create-${minecraft_version}:${create_version}:slim"
            ) as ExternalModuleDependency

    createSlimDependency.transitive = false
    implementation(createSlimDependency)

    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    implementation "maven.modrinth:jade:15.10.0+neoforge"
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")

    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    compileOnly(
            "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    )

    if (loadJeiRuntime) {
        runtimeOnly(
                "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
        )
    }

    compileOnly(
            "dev.emi:emi-neoforge:${emi_version}:api"
    )

    if (loadEmiRuntime) {
        runtimeOnly(
                "dev.emi:emi-neoforge:${emi_version}"
        )
    }

    annotationProcessor('org.spongepowered:mixin:0.8.7:processor')
}

final def generatedRefmapDirectory = layout.buildDirectory.dir('generated/mixin')
final String generatedRefmapName = 'sulfuricresonance.refmap.json'

tasks.withType(JavaCompile).configureEach { JavaCompile compileTask ->
    compileTask.options.encoding = 'UTF-8'

    compileTask.options.compilerArgs.add(
            '-AoutRefMapFile=' + generatedRefmapDirectory.get()
                    .file(generatedRefmapName)
                    .asFile
                    .absolutePath
    )
}

tasks.named('processResources', ProcessResources).configure { ProcessResources resourceTask ->
    resourceTask.dependsOn(tasks.named('compileJava'))
    resourceTask.from(generatedRefmapDirectory)
}

tasks.register('verifySecurityDependencies') {
    group = 'verification'
    description = 'Verify JLine and LZ4 security versions and Netty alignment on build and development launch paths'
    notCompatibleWithConfigurationCache('Inspects resolved dependency graphs')
    doLast {
        def report = [:]
        ['runtimeClasspath', 'compileClasspath', 'clientLegacyClasspath', 'serverLegacyClasspath',
         'neoFormRuntimeDependenciesRuntimeClasspath', 'neoFormRuntimeDependenciesCompileClasspath'].each { name ->
            def configuration = configurations.findByName(name)
            if (configuration == null || !configuration.canBeResolved) {
                throw new GradleException("Missing security-audited configuration: ${name}")
            }
            def modules = configuration.incoming.resolutionResult.allComponents.findAll {
                it.id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier
            }.collect { [group: it.id.group, name: it.id.module, version: it.id.version] }.sort { "${it.group}:${it.name}" }
            modules.each { module ->
                if (module.group == 'org.jline' && module.version != jline_security_version.toString()) {
                    throw new GradleException("Unpatched JLine module in ${name}: ${module}")
                }
            }
            modules.each { module ->
                if (module.group == 'org.lz4' && module.name == 'lz4-java') {
                    throw new GradleException("Unmaintained LZ4 artifact in " + name)
                }
                if (module.group == 'at.yawk.lz4' && module.name == 'lz4-java'
                        && module.version != lz4_java_security_version.toString()) {
                    throw new GradleException("Unpatched LZ4 module in " + name)
                }
            }
            def nettyVersions = modules.findAll { module ->
                module.group == 'io.netty' && module.name.startsWith('netty-')
                        && !module.name.startsWith('netty-tcnative')
                        && !module.name.startsWith('netty-incubator')
            }.collect { it.version }.unique()
            if (nettyVersions.size() > 1) {
                throw new GradleException("Mixed Netty versions in ${name}: ${nettyVersions}")
            }
            logger.lifecycle("Platform-selected Netty in ${name}: ${nettyVersions}; patched security status is not asserted")
            report[name] = modules
        }
        def output = layout.buildDirectory.file('reports/security/resolved-dependencies.json').get().asFile
        output.parentFile.mkdirs()
        output.text = JsonOutput.prettyPrint(JsonOutput.toJson(report))
        logger.lifecycle("Verified JLine ${jline_security_version}, LZ4 ${lz4_java_security_version}, and Netty alignment in ${report.size()} configurations")
    }
}
